plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
}

// 应用更新源：public URL 不是凭据，可随构建配置；local.properties 优先于环境变量。
// 私钥绝不进入仓库，只由 scripts/make_update_manifest.py 在发版机本地读取。
def updateProps = new java.util.Properties()
def updatePropsFile = rootProject.file('local.properties')
if (updatePropsFile.exists()) {
    updatePropsFile.withInputStream { updateProps.load(it) }
}
def updateValue = { String key, String fallback ->
    def local = updateProps.getProperty(key)
    def env = System.getenv(key)
    def value = (local != null && !local.trim().isEmpty()) ? local.trim()
        : ((env != null && !env.trim().isEmpty()) ? env.trim() : fallback)
    value
}
def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// 地图 KEY：local.properties / 环境变量提供，缺失时留空（不影响构建，只影响地图鉴权）。
def mapsApiKey = updateValue('MAPS_API_KEY', '')
def mapsSafeCode = updateValue('MAPS_SAFE_CODE', '')

// 发布签名：仓库内不放 keystore，由本地 local.properties 或 CI secrets 提供。
// 四项缺任意一项就不配置签名，assembleRelease 产出 unsigned APK；
// 本地可在 local.properties 填写，CI 从仓库 secrets 注入。
def signingValue = { String key -> updateValue(key, '') }
def releaseStorePath = signingValue('GOGOGO_KEYSTORE_FILE')
def releaseStorePassword = signingValue('GOGOGO_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('GOGOGO_KEY_ALIAS')
def releaseKeyPassword = signingValue('GOGOGO_KEY_PASSWORD')
def releaseSigningFile = releaseStorePath ? rootProject.file(releaseStorePath) : null
def hasReleaseSigning = releaseSigningFile != null && releaseSigningFile.length() > 0 &&
    !releaseStorePassword.isEmpty() && !releaseKeyAlias.isEmpty() && !releaseKeyPassword.isEmpty()
// 国内主源：Gitee raw 直连快；Pages 为备源。检查更新时双源并行拉取、按 versionCode 择优。
def updateManifestUrl = updateValue(
    'GOGOGO_UPDATE_URL',
    'https://gitee.com/sonder123i/cloud-traces/raw/master/docs/update/stable.json'
)
def updateBackupUrl = updateValue(
    'GOGOGO_UPDATE_BACKUP_URL',
    'https://sonder123i.github.io/CloudTrace/update/stable.json'
)
def updateAllowedHosts = updateValue(
    'GOGOGO_UPDATE_ALLOWED_HOSTS',
    'sonder123i.github.io,gitee.com,foruda.gitee.com,raw.giteeusercontent.com,attachments.gitee.com,' +
        'github.com,raw.githubusercontent.com,release-assets.githubusercontent.com,' +
        'objects.githubusercontent.com'
)

android {
    ndkVersion = '27.0.12077973'
    // Liquid Glass 2.0 的 API 36 RuntimeColorFilter / RuntimeXfermode 需要 36 才能被 R8 解析
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    namespace = 'com.zcshou.gogogo'

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseSigningFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.zcshou.gogogo"
        minSdkVersion 27
        targetSdkVersion 34
        versionCode 1143
        versionName '1.14.3' // https://semver.org/lang/zh-CN/
        buildConfigField "String", "UPDATE_MANIFEST_URL", buildConfigString(updateManifestUrl)
        buildConfigField "String", "UPDATE_BACKUP_URL", buildConfigString(updateBackupUrl)
        buildConfigField "String", "UPDATE_ALLOWED_HOSTS", buildConfigString(updateAllowedHosts)
        buildConfigField "boolean", "UPDATE_ENABLED", (!updateManifestUrl.isEmpty()).toString()
        buildConfigField "String", "MAPS_API_KEY", buildConfigString(mapsApiKey)
        buildConfigField "String", "MAPS_SAFE_CODE", buildConfigString(mapsSafeCode)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['zh', 'zh-rCN', 'en', 'en-rUS']
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled = true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources = true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            multiDexEnabled = true
        }
        debug {
            // 本地有发布签名时沿用它，保证百度地图 AK 安全码（包名+签名）在调试包上一致；
            // 没有时交给 AGP 的默认 debug keystore。
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    // 地图 KEY 与更新地址通过 buildConfigField 注入，来源为 local.properties 或环境变量
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    // Room schema JSON 导出到 app/schemas/ 入库（GoRunDatabase.exportSchema = true）
    ksp {
        arg('room.schemaLocation', "$projectDir/schemas")
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    packagingOptions {
        jniLibs {
            excludes += ['lib/armeabi/**']
            // 解压 so 到 lib 目录再加载：兼容 MuMu 等 ARM 翻译层（否则 JNI 符号注册失败）
            useLegacyPackaging = true
        }
        resources {
            excludes += ['lib/armeabi/**']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
        // MigrationTestHelper 从 assets 读 schema JSON 逐版本校验迁移
        androidTest {
            assets.srcDirs += files("$projectDir/schemas")
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // 指定输出的可执行程序的名字
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                def fileName
                if (variant.buildType.name == 'release') {
                    fileName = "CloudTrace_${defaultConfig.versionName}_arm64-v8a_release.apk"
                } else {
                    fileName = "CloudTrace_${defaultConfig.versionName}_arm64-v8a_debug.apk"
                }
                outputFileName=fileName
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // AppCompat 1.5.1 开始显式依赖于 Lifecycle 2.5.1 和 SavedState 1.2.0
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.preference
    implementation libs.material
    implementation libs.okhttp
    implementation libs.xlog
    implementation libs.markwon.core
    // 百度 LBS SDK 经上方 fileTree(libs/*.jar) 引入
    // V4.0：底部玻璃坞站与面板展开的物理弹簧动画（SpringAnimation）
    implementation libs.dynamicanimation
    // V6.0：iOS 26 液态玻璃 —— View 级 SDF 折射 / 色散 / Liquid Press
    implementation libs.liquidglass
    // --- run 包二开依赖（Kotlin + Coroutines + Room + DataStore） ---
    implementation libs.kotlinx.coroutines.android
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler
    implementation libs.datastore.preferences
    // Phase 5：可选 Shizuku 联动（未安装/未授权时安全降级为弹窗提醒）
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    testImplementation libs.junit
    // 更新清单验签单测：android.jar 里的 org.json 是空壳，补真实实现
    testImplementation libs.org.json
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation(libs.espresso.core, {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    // Room 迁移测试：用导出的 schema JSON 校验 1→2→3 迁移的列/默认值正确性
    androidTestImplementation libs.room.testing
}
