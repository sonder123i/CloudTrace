# 版本目录：全部依赖与插件的坐标/版本单点管理，模块内通过 libs.* 引用
[versions]
agp = "8.12.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
lifecycle = "2.5.1"
appcompat = "1.5.1"
constraintlayout = "2.1.4"
preference = "1.2.1"
material = "1.7.0"
okhttp = "4.12.0"
xlog = "1.11.1"
markwon = "4.6.2"
dynamicanimation = "1.0.0"
liquidglass = "v2.0.11"
coroutines = "1.8.1"
room = "2.6.1"
datastore = "1.1.1"
shizuku = "13.1.5"
junit = "4.13.2"
orgJson = "20231013"
zxing = "3.5.3"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"

[libraries]
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
preference = { module = "androidx.preference:preference", version.ref = "preference" }
material = { module = "com.google.android.material:material", version.ref = "material" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
xlog = { module = "com.elvishew:xlog", version.ref = "xlog" }
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "dynamicanimation" }
liquidglass = { module = "com.github.QWEA0:liquidglass", version.ref = "liquidglass" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
